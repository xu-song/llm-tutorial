<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="430" viewBox="0 0 1020 430" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3 post-training pipeline</title>
  <desc id="desc">A schematic of Qwen3 post-training from cold start, RL, mode fusion, general RL, to strong-to-weak distillation and OPD.</desc>
  <rect width="1020" height="430" fill="#fafafa"/>
  <text x="510" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Qwen3 后训练：探索、融合与强到弱蒸馏</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="120" width="150" height="86" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="130" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">Long-CoT</text>
    <text x="130" y="176" text-anchor="middle" font-size="13" fill="#6d28d9">cold start</text>
    <rect x="245" y="120" width="150" height="86" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="320" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Reasoning RL</text>
    <text x="320" y="176" text-anchor="middle" font-size="13" fill="#047857">探索高质量解法</text>
    <rect x="435" y="120" width="150" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="510" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Mode Fusion</text>
    <text x="510" y="176" text-anchor="middle" font-size="13" fill="#2563eb">thinking / no_think</text>
    <rect x="625" y="120" width="150" height="86" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="700" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">General RL</text>
    <text x="700" y="176" text-anchor="middle" font-size="13" fill="#92400e">通用助手行为</text>
    <rect x="815" y="120" width="150" height="86" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="890" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Strong-to-Weak</text>
    <text x="890" y="176" text-anchor="middle" font-size="13" fill="#b91c1c">Off-policy + OPD</text>
    <path d="M205 163 H239" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M395 163 H429" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M585 163 H619" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M775 163 H809" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <rect x="210" y="270" width="600" height="72" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="510" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">OPD 的位置：学生 rollout，强老师在学生状态上给 logits / KL 信号</text>
  <text x="510" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">把强推理策略压进更小、更便宜的 dense / MoE 学生模型</text>
  <text x="510" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">根据 Yang et al. (2025) Qwen3 Technical Report Figure 1 与 Table 21 重绘</text>
</svg>
