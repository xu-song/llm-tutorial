<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">MiMo-v2-Flash MOPD pipeline</title>
  <desc id="desc">A schematic of MiMo-v2-Flash combining a Flash MoE student, multi-domain teachers, token-level rewards and outcome rewards.</desc>
  <rect width="1040" height="520" fill="#fafafa"/>
  <text x="520" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">MiMo-v2-Flash：Flash MoE 上的多教师在线蒸馏</text>
  <rect x="58" y="112" width="210" height="250" rx="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="163" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#3730a3">Flash Student</text>
  <text x="163" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4338ca">309B 总参 / 15B 激活</text>
  <text x="163" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4338ca">SWA + 全局注意力</text>
  <text x="163" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4338ca">32K → 256K 上下文</text>
  <text x="163" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4338ca">学生自己 rollout</text>
  <path d="M268 236 H384" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="384" y="94" width="270" height="286" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="519" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#065f46">学生轨迹上的老师打分</text>
  <rect x="414" y="166" width="210" height="42" rx="12" fill="#d1fae5" stroke="#10b981"/>
  <text x="519" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#065f46">数学 / 推理老师</text>
  <rect x="414" y="222" width="210" height="42" rx="12" fill="#d1fae5" stroke="#10b981"/>
  <text x="519" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#065f46">代码老师</text>
  <rect x="414" y="278" width="210" height="42" rx="12" fill="#d1fae5" stroke="#10b981"/>
  <text x="519" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#065f46">智能体 / 通用老师</text>
  <text x="519" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#047857">dense token-level rewards</text>
  <path d="M654 236 H760" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="760" y="112" width="220" height="250" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="870" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">结果约束与部署</text>
  <text x="870" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">可验证 outcome reward</text>
  <text x="870" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">MTP 投机解码</text>
  <text x="870" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">平均 accepted length ≈ 3.6</text>
  <text x="870" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">推理加速约 2.6×</text>
  <path d="M870 362 C790 452 292 452 163 362" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="520" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">更新后的学生继续采样：训练分布始终贴近目标 Flash 模型自己的错误状态</text>
  <text x="520" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">根据 MiMo-v2-Flash Technical Report 与 OPD / MOPD 机制重绘</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
