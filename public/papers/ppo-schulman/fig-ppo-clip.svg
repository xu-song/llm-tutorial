<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">PPO clip objective intuition</title>
  <desc id="desc">A schematic showing how PPO clips the probability ratio for positive and negative advantages.</desc>
  <rect width="900" height="420" fill="#fafafa"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">PPO-Clip：只截停“过头”的更新</text>
  <line x1="110" y1="320" x2="790" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="450" y1="80" x2="450" y2="350" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="310" y1="80" x2="310" y2="350" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="590" y1="80" x2="590" y2="350" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="310" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ef4444">1−ε</text>
  <text x="450" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#374151">r=1</text>
  <text x="590" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ef4444">1+ε</text>
  <polyline points="130,285 310,230 450,180 590,130 760,130" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="130,140 310,140 450,185 590,230 760,285" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="705" y="122" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#059669">A &gt; 0：好动作加码到 1+ε 后不再奖励</text>
  <text x="705" y="306" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2563eb">A &lt; 0：坏动作压到 1−ε 后不再奖励</text>
  <rect x="312" y="88" width="276" height="246" fill="#10b981" opacity="0.08"/>
  <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#065f46">可信更新区间</text>
  <text x="450" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">根据 Schulman et al. (2017) 的 clipped surrogate objective 重绘</text>
</svg>
