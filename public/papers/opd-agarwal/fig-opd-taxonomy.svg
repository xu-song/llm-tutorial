<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">OPD training taxonomy</title>
  <desc id="desc">A comparison of SFT, RLVR, OPD and multi-teacher OPD by state source and supervision density.</desc>
  <rect width="980" height="470" fill="#fafafa"/>
  <text x="490" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">OPD 的位置：学生状态上的密集老师信号</text>
  <line x1="140" y1="365" x2="840" y2="365" stroke="#374151" stroke-width="2"/>
  <line x1="140" y1="365" x2="140" y2="95" stroke="#374151" stroke-width="2"/>
  <text x="490" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#374151">状态来源：离线 teacher/data 轨迹 → 学生 on-policy rollout</text>
  <text x="45" y="230" text-anchor="middle" transform="rotate(-90 45 230)" font-family="Arial, sans-serif" font-size="17" fill="#374151">监督密度：稀疏终局奖励 → 逐 token 密集信号</text>
  <circle cx="275" cy="245" r="58" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="275" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">SFT / KD</text>
  <text x="275" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e40af">密集但 off-policy</text>
  <circle cx="690" cy="300" r="58" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="690" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">RLVR</text>
  <text x="690" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#b91c1c">on-policy 但稀疏</text>
  <circle cx="690" cy="145" r="66" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="690" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#065f46">OPD</text>
  <text x="690" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#047857">on-policy + dense</text>
  <circle cx="795" cy="145" r="42" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="795" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">MOPD</text>
  <text x="795" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">多老师路由</text>
  <text x="490" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">根据 Agarwal et al. (2024) GKD/OPD 框架与 veRL OPD 文档重绘</text>
</svg>
